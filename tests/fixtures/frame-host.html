<!doctype html><html lang="en"><meta charset="utf-8"><title>Frame host</title>
<style>body{font:16px sans-serif;min-height:2200px;margin:28px}iframe{width:640px;height:400px;border:11px solid #497;display:block;margin:40px 24px}#crossFrame{transform:rotate(4deg) scale(.85);transform-origin:top left;margin-top:170px}</style>
<h1>Frame host</h1><input id="frame-input" value="ROOT"><button id="frame-button">Root button</button><output id="root-clicks">0</output>
<iframe id="sameFrame" name="same-branch" src="frame-branch.html?remaining=2&amp;level=0&amp;mode=same"></iframe>
<iframe id="crossFrame" name="cross-branch"></iframe>
<script>
window.frameMarker='ROOT';window.readyFrames=[];
addEventListener('message',event=>{if(event.data?.relayReady)readyFrames.push(event.data.relayReady)});
document.querySelector('#frame-button').onclick=()=>document.querySelector('#root-clicks').textContent=String(Number(document.querySelector('#root-clicks').textContent)+1);
const remote=new URL('frame-branch.html?remaining=2&level=0&mode=cross',location.href);remote.hostname='localhost';
document.querySelector('#crossFrame').src=remote;
</script></html>
