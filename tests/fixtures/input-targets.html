<!doctype html><html lang="en"><meta charset="utf-8"><title>Owned input targets</title>
<style>body{margin:24px}input,textarea{display:block;margin:12px;width:200px;height:32px}input[hidden]{display:none}</style>
<input id="first" aria-label="Shared label" placeholder="Shared placeholder">
<textarea id="middle" aria-label="Shared label" placeholder="Shared placeholder"></textarea>
<input id="third" aria-label="Third label" placeholder="Third placeholder">
<input id="hidden" hidden aria-label="Hidden label">
<textarea id="last" aria-label="Last label"></textarea>
</html>
